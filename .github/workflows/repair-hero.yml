name: Repair hero image asset

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/repair-hero.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download approved high-resolution hero
        run: |
          curl --fail --location --retry 3 \
            'https://032881ac-ff27-403c-b920-65e9fa3083c1.sandbox.floot.app/_cdn/static/5e2ef7da-9140-4025-b0ef-54080c5e0ec7-inside-out-hero-gate-app.jpg' \
            --output assets/inside-out-hero-gate.jpg
          test "$(wc -c < assets/inside-out-hero-gate.jpg)" -gt 90000
          file assets/inside-out-hero-gate.jpg
      - name: Commit repaired image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/inside-out-hero-gate.jpg
          git commit -m 'Replace blurry hero with high-resolution image'
          git push
