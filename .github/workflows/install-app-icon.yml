name: Install selected app icon

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/install-app-icon.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download selected icon
        run: |
          curl --fail --location --retry 3 \
            'https://032881ac-ff27-403c-b920-65e9fa3083c1.sandbox.floot.app/_cdn/static/ce49c441-1a14-4b4b-be21-ab9954c6121c-inside-out-new-app-icon.png' \
            --output /tmp/icon-source.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('/tmp/icon-source.png').convert('RGB')
          im = im.resize((1024,1024), Image.Resampling.LANCZOS)
          im.save('assets/inside-out-app-icon.png', format='PNG', optimize=True)
          PY
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('assets/inside-out-app-icon.png')
          assert im.size==(1024,1024)
          assert im.mode=='RGB'
          print(im.size, im.mode)
          PY
      - name: Commit app icon
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/inside-out-app-icon.png
          git commit -m 'Add selected jail gate app icon'
          git push
